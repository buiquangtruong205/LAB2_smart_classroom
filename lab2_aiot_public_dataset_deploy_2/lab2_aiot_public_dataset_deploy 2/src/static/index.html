<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIoT Smart Classroom Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #06b6d4;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 3rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .card-title i {
            color: var(--primary);
        }

        /* Form Styles */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            color: var(--text);
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .btn {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 0.75rem;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1.5rem;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Results Styles */
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
        }

        .probability-gauge {
            width: 150px;
            height: 150px;
            position: relative;
        }

        .probability-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .probability-value {
            font-size: 1.5rem;
            font-weight: 700;
            display: block;
        }

        .probability-text {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .status-badges {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            flex: 1;
            margin-left: 2rem;
        }

        .badge {
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 500;
        }

        .badge-occupancy {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .badge-occupancy.empty {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .badge-anomaly {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .badge-anomaly.safe {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .result-details {
            display: grid;
            gap: 1rem;
        }

        .detail-item {
            background: rgba(15, 23, 42, 0.4);
            border-radius: 1rem;
            padding: 1.25rem;
            border-left: 4px solid var(--primary);
        }

        .detail-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .detail-value {
            font-size: 1.1rem;
            font-weight: 500;
            line-height: 1.4;
        }

        .detail-item.decision { border-color: var(--primary); }
        .detail-item.hint { border-color: var(--accent); }
        .detail-item.note { border-color: var(--warning); }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            animation: fadeIn 0.6s ease forwards;
        }

        .card:nth-child(2) {
            animation-delay: 0.2s;
        }

        /* Floating elements for background effect */
        .blob {
            position: fixed;
            width: 300px;
            height: 300px;
            background: var(--primary);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.2;
            animation: float 20s infinite alternate;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(100px, 100px); }
        }
    </style>
</head>
<body>
    <div class="blob" style="top: -100px; left: -100px;"></div>
    <div class="blob" style="bottom: -100px; right: -100px; background: var(--accent); animation-delay: -5s;"></div>

    <div class="container">
        <header>
            <h1>AIoT Smart Classroom</h1>
            <p>Real-time Occupancy Intelligence Dashboard</p>
        </header>

        <main class="grid">
            <!-- Prediction Interface (Form) -->
            <section class="card">
                <h2 class="card-title">
                    <i data-lucide="settings-2"></i>
                    Sensor Data Input
                </h2>
                <form id="predict-form">
                    <div class="form-grid">
                        <div class="input-group">
                            <label for="Temperature">Temperature (°C)</label>
                            <input type="number" id="Temperature" step="0.01" value="20.91" required>
                        </div>
                        <div class="input-group">
                            <label for="Humidity">Humidity (%)</label>
                            <input type="number" id="Humidity" step="0.01" value="20.0" required>
                        </div>
                        <div class="input-group">
                            <label for="Light">Light (Lux)</label>
                            <input type="number" id="Light" step="0.01" value="200.0" required>
                        </div>
                        <div class="input-group">
                            <label for="CO2">CO2 (ppm)</label>
                            <input type="number" id="CO2" step="0.01" value="450.0" required>
                        </div>
                        <div class="input-group" style="grid-column: span 2;">
                            <label for="HumidityRatio">Humidity Ratio</label>
                            <input type="number" id="HumidityRatio" step="0.0001" value="0.002" required>
                        </div>
                    </div>
                    <button type="submit" class="btn" id="submit-btn">
                        <i data-lucide="zap"></i>
                        Run AI Analysis
                    </button>
                </form>
            </section>

            <!-- Analysis Results -->
            <section class="card" id="results-card">
                <h2 class="card-title">
                    <i data-lucide="bar-chart-3"></i>
                    Analysis Results
                </h2>
                <div id="results-content">
                    <div class="results-header">
                        <div class="probability-gauge">
                            <canvas id="gaugeChart"></canvas>
                            <div class="probability-label">
                                <span class="probability-value" id="res-prob">--</span>
                                <span class="probability-text">Probability</span>
                            </div>
                        </div>
                        <div class="status-badges">
                            <div id="badge-occ" class="badge badge-occupancy">
                                <i data-lucide="users"></i>
                                <span id="res-occ">Waiting...</span>
                            </div>
                            <div id="badge-ano" class="badge badge-anomaly safe">
                                <i data-lucide="shield-check"></i>
                                <span id="res-ano">System Ready</span>
                            </div>
                        </div>
                    </div>

                    <div class="result-details">
                        <div class="detail-item decision">
                            <div class="detail-label">Decision</div>
                            <div class="detail-value" id="res-decision">Submit the form to start analysis</div>
                        </div>
                        <div class="detail-item hint">
                            <div class="detail-label">Command Hint</div>
                            <div class="detail-value" id="res-hint">--</div>
                        </div>
                        <div class="detail-item note">
                            <div class="detail-label">Safety Note</div>
                            <div class="detail-value" id="res-note">--</div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Initialize Gauge Chart
        const ctx = document.getElementById('gaugeChart').getContext('2d');
        let gaugeChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                datasets: [{
                    data: [0, 100],
                    backgroundColor: ['#6366f1', 'rgba(255, 255, 255, 0.05)'],
                    borderWidth: 0,
                    circumference: 240,
                    rotation: 240,
                    cutout: '85%',
                    borderRadius: 10
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: { display: false },
                    tooltip: { enabled: false }
                }
            }
        });

        function updateGauge(value) {
            gaugeChart.data.datasets[0].data = [value, 100 - value];
            // Color based on probability
            if (value > 70) gaugeChart.data.datasets[0].backgroundColor[0] = '#ef4444';
            else if (value > 30) gaugeChart.data.datasets[0].backgroundColor[0] = '#6366f1';
            else gaugeChart.data.datasets[0].backgroundColor[0] = '#10b981';
            gaugeChart.update();
        }

        // Handle Form Submission
        const form = document.getElementById('predict-form');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI Loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i data-lucide="loader-2" class="animate-spin"></i> Processing...';
            lucide.createIcons();

            const payload = {
                room_id: "room_101",
                device_id: "env_node_01",
                Temperature: parseFloat(document.getElementById('Temperature').value),
                Humidity: parseFloat(document.getElementById('Humidity').value),
                Light: parseFloat(document.getElementById('Light').value),
                CO2: parseFloat(document.getElementById('CO2').value),
                HumidityRatio: parseFloat(document.getElementById('HumidityRatio').value)
            };

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error('API Error');

                const data = await response.json();
                displayResults(data);
            } catch (error) {
                console.error(error);
                alert('Error connecting to the AI service. Make sure the server is running.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i data-lucide="zap"></i> Run AI Analysis';
                lucide.createIcons();
            }
        });

        function displayResults(data) {
            const output = data.model_output;
            const decision = data.decision;

            // Update Probability
            const probPercent = (output.occupancy_probability * 100).toFixed(1);
            document.getElementById('res-prob').innerText = probPercent + '%';
            updateGauge(parseFloat(probPercent));

            // Update Occupancy Badge
            const occBadge = document.getElementById('badge-occ');
            const occText = document.getElementById('res-occ');
            const occIcon = occBadge.querySelector('svg') || occBadge.querySelector('i');
            if (output.predicted_occupancy === 1) {
                occBadge.className = 'badge badge-occupancy';
                occText.innerText = 'Occupied';
                if (occIcon) occIcon.setAttribute('data-lucide', 'users');
            } else {
                occBadge.className = 'badge badge-occupancy empty';
                occText.innerText = 'Empty';
                if (occIcon) occIcon.setAttribute('data-lucide', 'user-minus');
            }

            // Update Anomaly Badge
            const anoBadge = document.getElementById('badge-ano');
            const anoText = document.getElementById('res-ano');
            const anoIcon = anoBadge.querySelector('svg') || anoBadge.querySelector('i');
            if (output.is_anomaly) {
                anoBadge.className = 'badge badge-anomaly';
                anoText.innerText = `Anomaly (${output.anomaly_score})`;
                if (anoIcon) anoIcon.setAttribute('data-lucide', 'alert-triangle');
            } else {
                anoBadge.className = 'badge badge-anomaly safe';
                anoText.innerText = 'Normal Data';
                if (anoIcon) anoIcon.setAttribute('data-lucide', 'shield-check');
            }

            // Update Details
            document.getElementById('res-decision').innerText = decision.decision || '--';
            document.getElementById('res-hint').innerText = decision.command_hint || '--';
            document.getElementById('res-note').innerText = decision.safety_note || '--';

            lucide.createIcons();
        }

        // Add spinning animation for icons if needed
        const style = document.createElement('style');
        style.innerHTML = `
            .animate-spin {
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
